id: tc-riau-penduduk-pdrb-viz
description: Verify the agent visualizes the relationship between population and PDRB per capita in Riau.
input:
  message: Gambarin hubungan penduduk dan PDRB per kapita di Riau?
metrics:
  - name: tool_calls
    type: deterministic
    reference:
      tool_calls:
        - tool: bosa_sql_query_tool
          params:
            request:
              query:
                value: ["pdrb_adhk_2024", "jumlah_penduduk", "pdrb_per_kapita", "Riau"]
                match: keyword
        - tool: e2b_sandbox_tool
          params:
            code:
              value: ["import matplotlib.pyplot as plt", "plt.savefig"]
              match: keyword
  - name: completeness
    type: model
    threshold: 0.5
    model:
      name: openai/gpt-5.4
      credentials: env:OPENAI_API_KEY
    reference: "A complete response must include: (1) a chart or visualization showing the relationship between population and PDRB per capita for Riau districts, (2) a correlation metric (e.g. Pearson r), and (3) an interpretation of the relationship pattern."
  - name: groundedness
    type: model
    threshold: 0.5
    model:
      name: openai/gpt-5.4
      credentials: env:OPENAI_API_KEY
    reference: "All factual claims in the response must be traceable to the SQL query results and Python code execution output. This includes: the Pearson correlation value, the date of the data (2024-12-31), district names mentioned, and population/PDRB per capita figures."
