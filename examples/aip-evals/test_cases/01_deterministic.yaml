id: tc-aceh-best-ranking
description: Verify the agent finds the region with the best national ranking in Aceh.
input:
  message: Daerah mana yang ranking nasionalnya terbaik di Aceh?
metrics:
  - name: tool_calls
    type: deterministic
    reference:
      tool_calls:
        - tool: bosa_sql_query_tool
          params:
            request:
              query:
                value: ["pdrb_adhk_2024", "peringkat_nasional", "peringkat_provinsi", "provinsi"]
                match: keyword
          output:
            value: ["Aceh Utara", "162"]
            match: keyword
  - name: response_keywords
    type: deterministic
    reference:
      keywords: ["Aceh Utara", "162"]
