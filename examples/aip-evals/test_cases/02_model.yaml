id: tc-simeulue-pdrb-last-year
description: Verify the agent correctly answers PDRB of Simeulue for last year.
input:
  message: PDRB Simeulue tahun lalu berapa?
metrics:
  - name: completeness
    type: model
    threshold: 0.5
    model:
      name: openai/gpt-5.4
      credentials: env:OPENAI_API_KEY
    reference: "A complete response must include: (1) the PDRB value for Kabupaten Simeulue which is 1806.62 miliar rupiah, (2) the year the data refers to (2023), and (3) the unit of the value (miliar rupiah)."
  - name: groundedness
    type: model
    threshold: 0.5
    model:
      name: openai/gpt-5.4
      credentials: env:OPENAI_API_KEY
    reference: "All factual claims in the response must be traceable to the SQL query results. This includes: the PDRB value (1806.62 miliar rupiah), the date (2023-12-31), and the kabupaten name (Simeulue)."
