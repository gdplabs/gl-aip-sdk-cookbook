[project]
name = "aip-evals-local"
version = "0.1.0"
description = "Demonstrate AIP evals module — evaluate local agents using deterministic, python, and model metrics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "glaip-sdk[local,evals]>=0.8.36",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "psycopg2-binary>=2.9.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
