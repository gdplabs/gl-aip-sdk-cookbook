[project]
name = "aip-evals"
version = "0.1.0"
description = "Demonstrate native gllm-evals suites with local and hosted employee lookup agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "glaip-sdk[local,evals]>=0.8.57",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
